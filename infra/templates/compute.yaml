AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Compute layer for the yt Sales IaC pipeline.
  Creates the Acquisition Lambda, Glue MSK connection,
  Landing-to-MSK Glue job, Bronze-to-Silver Glue job,
  and associated CloudWatch log groups.

# ============================================================
# Parameters
# ============================================================

Parameters:

  ProjectName:
    Type: String
    Default: yt-sales-iac
    Description: Common resource naming prefix.


  # ----------------------------------------------------------
  # Storage
  # ----------------------------------------------------------

  LandingBucketName:
    Type: String
    Default: yt-sales-iac-landing-878670310452
    Description: Landing/archive/manifest bucket.

  LakehouseBucketName:
    Type: String
    Default: yt-sales-iac-lakehouse-878670310452
    Description: Bronze/Silver/Gold lakehouse bucket.

  ArtifactsBucketName:
    Type: String
    Default: yt-sales-iac-artifacts-878670310452
    Description: Deployment artifacts, Glue scripts and JARs.


  # ----------------------------------------------------------
  # DynamoDB
  # ----------------------------------------------------------

  IngestionControlTableName:
    Type: String
    Default: yt-sales-iac-ingestion-control


  # ----------------------------------------------------------
  # IAM roles produced by iam.yaml
  # ----------------------------------------------------------

  AcquisitionLambdaRoleArn:
    Type: String
    Description: IAM role ARN for Acquisition Lambda.

  GlueLandingToMSKRoleArn:
    Type: String
    Description: IAM role ARN for Landing-to-MSK Glue job.

  GlueBronzeToSilverRoleArn:
    Type: String
    Description: IAM role ARN for Bronze-to-Silver Glue job.


  # ----------------------------------------------------------
  # Network
  # ----------------------------------------------------------

  GlueSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Private subnet used by the Glue Kafka connection.

  GlueSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group used by Glue Spark workers.

  GlueAvailabilityZone:
    Type: String
    Default: ap-southeast-1a


  # ----------------------------------------------------------
  # MSK
  # ----------------------------------------------------------

  MSKBootstrapServers:
    Type: String
    Description: >
      IAM/TLS bootstrap servers from the IaC-created MSK cluster.
      Example:
      b-1.example.kafka.ap-southeast-1.amazonaws.com:9098,
      b-2.example.kafka.ap-southeast-1.amazonaws.com:9098


  # ----------------------------------------------------------
  # Acquisition
  # ----------------------------------------------------------

  SourceUrl:
    Type: String
    Default: 'https://eforexcel.com/wp/wp-content/uploads/2020/09/2m-Sales-Records.zip'

  SourceName:
    Type: String
    Default: sales

  DatasetName:
    Type: String
    Default: sales_records

  LambdaRuntime:
    Type: String
    Default: python3.12
    Description: Python runtime for the Acquisition Lambda.


# ============================================================
# Resources
# ============================================================

Resources:

  # ==========================================================
  # CloudWatch - Acquisition Lambda
  # ==========================================================

  AcquisitionLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:

      LogGroupName:
        !Sub '/aws/lambda/${ProjectName}-acquisition'

      RetentionInDays: 14

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Component
          Value: Acquisition

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # Acquisition Lambda
  #
  # Current DEV:
  # Memory       = 2048 MB
  # Timeout      = 14m 59s
  # /tmp storage = 4096 MB
  #
  # No VPC attachment intentionally.
  # Lambda needs outbound Internet access to download
  # the external source ZIP.
  # ==========================================================

  AcquisitionLambda:
    Type: AWS::Lambda::Function

    DependsOn:
      - AcquisitionLambdaLogGroup

    Properties:

      FunctionName:
        !Sub '${ProjectName}-acquisition'

      Description: >
        Downloads the yt Sales source ZIP, archives the source,
        extracts CSV files, writes landing objects and manifests,
        and records ingestion metadata in DynamoDB.

      Runtime:
        !Ref LambdaRuntime

      Handler:
        iata_sales_acquisition.lambda_handler

      Role:
        !Ref AcquisitionLambdaRoleArn

      PackageType: Zip

      Code:
        S3Bucket:
          !Ref ArtifactsBucketName

        S3Key:
          lambda/iata_sales_acquisition.zip

      MemorySize: 2048

      Timeout: 899

      EphemeralStorage:
        Size: 4096

      Architectures:
        - x86_64

      Environment:

        Variables:

          CONTROL_TABLE:
            !Ref IngestionControlTableName

          DATASET_NAME:
            !Ref DatasetName

          LANDING_BUCKET:
            !Ref LandingBucketName

          SOURCE_NAME:
            !Ref SourceName

          SOURCE_URL:
            !Ref SourceUrl


      LoggingConfig:

        LogFormat: Text

        LogGroup:
          !Ref AcquisitionLambdaLogGroup


      Tags:

        - Key: Project
          Value: !Ref ProjectName

        - Key: Component
          Value: Acquisition

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # Glue Kafka / MSK Connection
  #
  # Replacement for:
  # yt-sales-msk-connection
  #
  # New:
  # yt-sales-iac-msk-connection
  # ==========================================================

  GlueMSKConnection:
    Type: AWS::Glue::Connection

    Properties:

      CatalogId:
        !Ref AWS::AccountId

      ConnectionInput:

        Name:
          !Sub '${ProjectName}-msk-connection'

        Description: >
          Private Kafka connection used by AWS Glue
          Landing-to-MSK producer.

        ConnectionType: KAFKA

        ConnectionProperties:

          KAFKA_BOOTSTRAP_SERVERS:
            !Ref MSKBootstrapServers

          KAFKA_SSL_ENABLED:
            'true'

          KAFKA_SASL_MECHANISM:
            AWS_MSK_IAM


        PhysicalConnectionRequirements:

          AvailabilityZone:
            !Ref GlueAvailabilityZone

          SubnetId:
            !Ref GlueSubnetId

          SecurityGroupIdList:
            - !Ref GlueSecurityGroupId

  # ==========================================================
  # CloudWatch Logs - Landing -> MSK
  #
  # Glue 5.x writes separate error/output log groups when
  # --custom-logGroup-prefix is configured.
  # ==========================================================

  LandingToMSKErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:

      LogGroupName:
        !Sub '/aws/glue/${ProjectName}-landing-to-msk/error'

      RetentionInDays: 7


  LandingToMSKOutputLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:

      LogGroupName:
        !Sub '/aws/glue/${ProjectName}-landing-to-msk/output'

      RetentionInDays: 7


  # ==========================================================
  # Landing -> MSK Glue Job
  # ==========================================================

  LandingToMSKGlueJob:
    Type: AWS::Glue::Job

    DependsOn:
      - GlueMSKConnection
      - LandingToMSKErrorLogGroup
      - LandingToMSKOutputLogGroup

    Properties:

      Name:
        !Sub '${ProjectName}-landing-to-msk'

      Description: >
        Reads an ingestion manifest and landing CSV files,
        enriches records with ingestion metadata, and produces
        JSON records to Amazon MSK.

      Role:
        !Ref GlueLandingToMSKRoleArn


      # -------------------------------------------------------
      # Spark runtime
      # -------------------------------------------------------

      Command:

        Name: glueetl

        PythonVersion: '3'

        ScriptLocation:
          !Sub 's3://${ArtifactsBucketName}/glue/scripts/iata_sales_landing_to_msk.py'


      GlueVersion: '5.1'

      WorkerType: G.1X

      NumberOfWorkers: 3

      ExecutionClass: STANDARD

      MaxRetries: 1

      Timeout: 30

      JobRunQueuingEnabled: false


      # -------------------------------------------------------
      # Enforce processing concurrency = 1
      # -------------------------------------------------------

      ExecutionProperty:

        MaxConcurrentRuns: 1


      # -------------------------------------------------------
      # Glue Kafka connection
      # -------------------------------------------------------

      Connections:

        Connections:
          - !Ref GlueMSKConnection


      # -------------------------------------------------------
      # Job Parameters
      #
      # MANIFEST_URI is intentionally NOT stored here.
      # Step Functions supplies it dynamically for each run.
      # -------------------------------------------------------

      DefaultArguments:

        '--job-language':
          python

        '--MSK_BOOTSTRAP_SERVERS':
          !Ref MSKBootstrapServers

        '--MSK_ERROR_TOPIC':
          !Sub '${ProjectName}-errors'

        '--MSK_MAIN_TOPIC':
          !Sub '${ProjectName}-records'


        # -----------------------------------------------------
        # Kafka dependencies
        # -----------------------------------------------------

        '--extra-jars':
          !Sub 's3://${ArtifactsBucketName}/glue/jars/spark-sql-kafka-0-10_2.12-3.5.6.jar,s3://${ArtifactsBucketName}/glue/jars/spark-token-provider-kafka-0-10_2.12-3.5.6.jar,s3://${ArtifactsBucketName}/glue/jars/aws-msk-iam-auth-2.3.7-all.jar'

        '--user-jars-first':
          'true'


        # -----------------------------------------------------
        # Glue metrics / observability
        # -----------------------------------------------------

        '--enable-metrics':
          ''

        '--enable-observability-metrics':
          'true'


        # -----------------------------------------------------
        # Glue 5.x CloudWatch logging
        # -----------------------------------------------------

        '--custom-logGroup-prefix':
          !Sub '/aws/glue/${ProjectName}-landing-to-msk'

        '--custom-logStream-prefix':
          !Sub '${ProjectName}-landing-to-msk'


        # -----------------------------------------------------
        # Spark UI
        # -----------------------------------------------------

        '--enable-spark-ui':
          'true'

        '--spark-event-logs-path':
          !Sub 's3://${ArtifactsBucketName}/glue/spark-ui/landing-to-msk/'

        '--TempDir':
          !Sub 's3://${ArtifactsBucketName}/glue/temporary/landing-to-msk/'


        # -----------------------------------------------------
        # Rolling Spark event logs
        # -----------------------------------------------------

        '--conf':
          spark.eventLog.rolling.enabled=true


      Tags:

        Project:
          !Ref ProjectName

        Component:
          LandingToMSK

        ManagedBy:
          CloudFormation

  # ==========================================================
  # CloudWatch Logs - Bronze -> Silver
  # ==========================================================

  BronzeToSilverErrorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:

      LogGroupName:
        !Sub '/aws/glue/${ProjectName}-bronze-to-silver/error'

      RetentionInDays: 7


  BronzeToSilverOutputLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:

      LogGroupName:
        !Sub '/aws/glue/${ProjectName}-bronze-to-silver/output'

      RetentionInDays: 7


  # ==========================================================
  # Bronze -> Silver Glue Job
  # ==========================================================

  BronzeToSilverGlueJob:
    Type: AWS::Glue::Job

    DependsOn:
      - BronzeToSilverErrorLogGroup
      - BronzeToSilverOutputLogGroup

    Properties:

      Name:
        !Sub '${ProjectName}-bronze-to-silver'

      Description: >
        Reads Bronze Apache Iceberg sales data, validates data
        quality, quarantines invalid records, removes duplicates,
        writes valid records to Silver Iceberg and records
        reconciliation statistics in DynamoDB.

      Role:
        !Ref GlueBronzeToSilverRoleArn


      Command:

        Name: glueetl

        PythonVersion: '3'

        ScriptLocation:
          !Sub 's3://${ArtifactsBucketName}/glue/scripts/iata_sales_bronze_to_silver.py'


      GlueVersion: '5.1'

      WorkerType: G.1X

      NumberOfWorkers: 3


      # -------------------------------------------------------
      # Cost optimisation
      #
      # Bronze -> Silver is not latency sensitive.
      # -------------------------------------------------------

      ExecutionClass: FLEX


      MaxRetries: 1

      Timeout: 10

      JobRunQueuingEnabled: false


      ExecutionProperty:

        MaxConcurrentRuns: 1


      # -------------------------------------------------------
      # Job Parameters
      #
      # SILVER_RUN_ID is intentionally absent.
      # Step Functions generates States.UUID() and supplies it
      # dynamically when starting the Glue job.
      # -------------------------------------------------------

      DefaultArguments:

        '--job-language':
          python

        '--BRONZE_TABLE':
          glue_catalog.iata_sales_iac_bronze.sales_raw

        '--CONTROL_TABLE':
          !Ref IngestionControlTableName

        '--LOAD_MODE':
          FULL

        '--QUARANTINE_PATH':
          !Sub 's3://${LakehouseBucketName}/quarantine/sales/'

        '--SILVER_TABLE':
          glue_catalog.iata_sales_iac_silver.sales

        '--datalake-formats':
          iceberg


        # -----------------------------------------------------
        # Iceberg Spark configuration
        # -----------------------------------------------------

        '--conf':
          !Sub >-
            spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
            --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
            --conf spark.sql.catalog.glue_catalog.warehouse=s3://${LakehouseBucketName}/
            --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
            --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO


        # -----------------------------------------------------
        # Observability
        # -----------------------------------------------------

        '--enable-metrics':
          ''

        '--enable-observability-metrics':
          'true'


        # -----------------------------------------------------
        # Glue 5.x CloudWatch logging
        # -----------------------------------------------------

        '--custom-logGroup-prefix':
          !Sub '/aws/glue/${ProjectName}-bronze-to-silver'

        '--custom-logStream-prefix':
          !Sub '${ProjectName}-bronze-to-silver'


        # -----------------------------------------------------
        # Spark UI
        # -----------------------------------------------------

        '--enable-spark-ui':
          'true'

        '--spark-event-logs-path':
          !Sub 's3://${ArtifactsBucketName}/glue/spark-ui/bronze-to-silver/'

        '--TempDir':
          !Sub 's3://${ArtifactsBucketName}/glue/temporary/bronze-to-silver/'


      Tags:

        Project:
          !Ref ProjectName

        Component:
          BronzeToSilver

        ManagedBy:
          CloudFormation


# ============================================================
# Outputs
# ============================================================

Outputs:

  # ----------------------------------------------------------
  # Acquisition
  # ----------------------------------------------------------

  AcquisitionLambdaArn:
    Description: Acquisition Lambda ARN

    Value:
      !GetAtt AcquisitionLambda.Arn

    Export:
      Name:
        !Sub '${ProjectName}-AcquisitionLambdaArn'


  AcquisitionLambdaName:
    Description: Acquisition Lambda function name

    Value:
      !Ref AcquisitionLambda

    Export:
      Name:
        !Sub '${ProjectName}-AcquisitionLambdaName'


  # ----------------------------------------------------------
  # Glue Connection
  # ----------------------------------------------------------

  GlueMSKConnectionName:
    Description: Glue Kafka/MSK connection

    Value:
      !Ref GlueMSKConnection

    Export:
      Name:
        !Sub '${ProjectName}-GlueMSKConnectionName'


  # ----------------------------------------------------------
  # Landing -> MSK
  # ----------------------------------------------------------

  LandingToMSKGlueJobName:
    Description: Landing to MSK Glue job name

    Value:
      !Ref LandingToMSKGlueJob

    Export:
      Name:
        !Sub '${ProjectName}-LandingToMSKGlueJobName'


  # ----------------------------------------------------------
  # Bronze -> Silver
  # ----------------------------------------------------------

  BronzeToSilverGlueJobName:
    Description: Bronze to Silver Glue job name

    Value:
      !Ref BronzeToSilverGlueJob

    Export:
      Name:
        !Sub '${ProjectName}-BronzeToSilverGlueJobName'


  # ----------------------------------------------------------
  # Logs
  # ----------------------------------------------------------

  AcquisitionLambdaLogGroupName:
    Value:
      !Ref AcquisitionLambdaLogGroup

  LandingToMSKErrorLogGroupName:
    Value:
      !Ref LandingToMSKErrorLogGroup

  BronzeToSilverErrorLogGroupName:
    Value:
      !Ref BronzeToSilverErrorLogGroup